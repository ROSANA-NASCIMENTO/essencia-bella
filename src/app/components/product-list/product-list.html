
<section>
  <h2>Nossos Produtos</h2>
  
  
<div class="lista-produtos">
  @for (produto of produtos(); track produto.id) {
    <app-product-card
      [id]="produto.id"
      [nome]="produto.nome"
      [preco]="produto.preco"
      [imagem]="produto.imagem"
      [descricao]="produto.descricao">
    </app-product-card>
  }
</div>

</section>
