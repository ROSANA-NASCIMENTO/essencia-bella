<header class="cabecalho">
  <div class="marca">
    <h1>Essência Bella</h1>
    <p>Cosméticos &amp; Perfumaria</p>
  </div>
  <nav aria-label="Menu principal">
    <a
  routerLink="/"
  routerLinkActive="rota-inicio"
  [routerLinkActiveOptions]="{ exact: true }">
  Início
</a>
    <a routerLink="/checkout" class="link-carrinho" aria-label="Ver carrinho de compras">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.5 13h12l2.5-9H6"/>
      </svg>
      <span>Carrinho</span>
      <span class="contador">{{ quantidade() }}</span>
    </a>
  </nav>
</header>
