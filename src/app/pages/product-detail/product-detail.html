@if (produto(); as p) {
  <h2>{{ p.title | uppercase }}</h2>
  <img [src]="p.thumbnail" [alt]="p.title">
  <p>{{ p.description }}</p>
  <p>Preço: {{ p.price | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}</p>
  <div class="acoes-detalhe">
    <button type="button" (click)="adicionarAoCarrinho()">Adicionar ao carrinho</button>
    <button type="button" class="secundario" routerLink="/">Voltar à loja</button>
  </div>
} @else if (erro()) {
  <p>Não foi possível carregar o produto.</p>
} @else {
  <p>Carregando produto...</p>
}
